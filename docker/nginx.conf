server {
    listen 80;
    server_name _;

    absolute_redirect off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /print {
        return 301 /print/;
    }

    location /print/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /print/index.html;
    }

    location / {
        return 302 /print/;
    }
}